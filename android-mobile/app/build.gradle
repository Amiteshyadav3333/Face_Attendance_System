plugins {
    id 'com.android.application'
}

def configuredUrl = providers.gradleProperty('attendanceUrl').orNull
if (configuredUrl != null) {
    def url = new URI(configuredUrl)
    if (url.scheme != 'https' || !url.host || url.userInfo || url.fragment || url.query) {
        throw new GradleException('attendanceUrl must be an HTTPS URL for the attendance frontend.')
    }
}

android {
    namespace 'com.faceattendance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.faceattendance.mobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'ATTENDANCE_URL',
                '"' + (configuredUrl ?: 'https://appassets.androidplatform.net/') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/attendanceWeb').get().asFile
    }
}
